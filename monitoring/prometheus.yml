global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: arbiter

scrape_configs:
  - job_name: arbiter_api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics/prometheus
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis exporter (if deployed)
  - job_name: redis
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
