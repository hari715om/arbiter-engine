[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-engine"
version = "0.7.0"
description = "AI-driven intelligent scheduling and resource allocation engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "docker>=7.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
arbiter-serve = "arbiter.api.server:serve"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
